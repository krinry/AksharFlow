[workspace]
resolver = "3"
members = [
  "crates/aksharflow-core",
  "src-tauri",
]
exclude = [
  "crates/aksharflow-craftui",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["AksharFlow Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
unicode-segmentation = "1.13"
unicode-normalization = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
