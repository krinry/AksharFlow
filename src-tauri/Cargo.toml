[package]
name = "aksharflow-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 host for AksharFlow"

[lib]
name = "aksharflow_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
aksharflow-core = { path = "../crates/aksharflow-core", features = ["specta-types"] }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-specta = { workspace = true }
